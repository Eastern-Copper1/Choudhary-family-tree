<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Choudhary"/>
<meta name="theme-color" content="#7C1D1D"/>
<title>Choudhary Family Tree</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden;background:#FDF6EE;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
#app{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
#topbar{background:#7C1D1D;display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:52px;padding-top:env(safe-area-inset-top,0px);flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.2);z-index:50}
.title{color:#fff;font-size:17px;font-weight:700;font-family:Georgia,serif}
.tbtn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;font-weight:700}
#page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
#nav{background:#fff;border-top:1px solid #EDE0D4;display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:50}
.ntab{flex:1;padding:10px 0 8px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.ntab .ico{font-size:22px;line-height:1}
.ntab .lbl{font-size:10px;font-weight:600;color:#A08060}
.ntab.active .lbl{color:#7C1D1D}
.ntab .bar{width:20px;height:3px;border-radius:2px;background:#7C1D1D;display:none}
.ntab.active .bar{display:block}
.hero{background:linear-gradient(160deg,#521212,#7C1D1D,#A0522D);padding:28px 20px 24px;color:#fff;text-align:center}
.esub{font-size:11px;letter-spacing:3px;color:#D4AF7F;text-transform:uppercase;margin-bottom:6px}
.ename{font-size:30px;font-family:Georgia,serif;font-weight:700;margin-bottom:2px}
.esub2{font-size:14px;color:#D4AF7F;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sn{font-size:22px;font-weight:700;font-family:Georgia,serif}
.sl{font-size:10px;color:#D4AF7F}
.ravi-card{margin:14px 14px 0;background:linear-gradient(135deg,#FFFBEE,#FFF5D6);border-radius:18px;padding:14px;border:1.5px solid #C9943A;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 4px 16px rgba(201,148,58,.15)}
.sec-lbl{padding:12px 16px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.mrow{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#fff;border-bottom:1px solid #EDE0D4;cursor:pointer;min-height:72px}
.mrow:active{background:#F5ECD8}
.mrow.rr{background:#FFFBEE}
.mn{font-size:16px;font-weight:600;color:#1A0A00;font-family:Georgia,serif;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{font-size:13px;color:#6B4226;margin-top:3px}
.rel{color:#C9943A;font-weight:600}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);font-family:Georgia,serif;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.swrap{position:sticky;top:0;z-index:10;background:#FDF6EE;padding:12px 16px 8px;border-bottom:1px solid #EDE0D4;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sinput{width:100%;padding:13px 40px 13px 44px;border-radius:14px;border:1.5px solid #EDE0D4;background:#fff;font-size:16px;outline:none;box-sizing:border-box;color:#1A0A00;-webkit-appearance:none}
.glbl{padding:10px 16px 4px;background:#FDF6EE;font-size:12px;font-weight:700;color:#7C1D1D}
.mnlbl{padding:10px 16px 4px;background:#FDF6EE;font-size:11px;font-weight:700;color:#C9943A;text-transform:uppercase;letter-spacing:1px}
.brow{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid #EDE0D4;cursor:pointer;min-height:68px}
.brow:active{background:#FDF6EE}
.bcal{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#7C1D1D,#A0522D);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.bd{font-size:18px;font-weight:700;line-height:1}
.bm{font-size:8px;line-height:1}
.brrow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border-bottom:1px solid #EDE0D4;cursor:pointer;min-height:68px}
.brrow:active{background:#FDF6EE}
.brico{width:44px;height:44px;border-radius:12px;background:rgba(124,29,29,.1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none}
#overlay.show{display:block}
#sheet{position:fixed;bottom:0;left:0;right:0;z-index:201;background:#FDF6EE;border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.25);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s ease}
#sheet.show{transform:translateY(0)}
.shandle{display:flex;justify-content:center;padding:12px 0 0}
.shandle div{width:40px;height:4px;border-radius:2px;background:#DDD}
.shdr{padding:16px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.sname{font-size:22px;font-weight:700;color:#1A0A00;font-family:Georgia,serif;line-height:1.2;text-align:center}
.srel{display:inline-block;border-radius:20px;padding:3px 14px;font-size:13px;font-weight:700;margin-top:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:#fff;border:1px solid #EDE0D4;border-radius:20px;padding:4px 12px;font-size:13px;color:#6B4226}
.pill.dead{background:#FEE2E2;border-color:#FCA5A5;color:#DC2626}
.cglbl{padding:10px 16px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.cgrow{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#fff;border-bottom:1px solid #EDE0D4;cursor:pointer}
.cgrow:active{background:#FDF6EE}
.cgn{font-size:15px;font-weight:600;color:#1A0A00;font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgs{font-size:12px;color:#6B4226;margin-top:2px}
.donebtn{width:100%;padding:16px;background:#7C1D1D;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin:8px 0 4px}
.pwrap{position:relative;display:inline-block}
.pbtn{position:absolute;bottom:0;right:0;background:#7C1D1D;border:2px solid #fff;border-radius:50%;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
/* ADD/EDIT PAGE */
.form-page{padding:16px}
.form-card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.form-title{font-size:20px;font-weight:700;color:#7C1D1D;font-family:Georgia,serif;margin-bottom:4px}
.form-sub{font-size:13px;color:#6B4226;margin-bottom:18px}
.flbl{font-size:12px;font-weight:700;color:#7C1D1D;text-transform:uppercase;letter-spacing:1px;display:block;margin:14px 0 6px}
.flbl:first-of-type{margin-top:0}
.finp{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #EDE0D4;font-size:16px;outline:none;box-sizing:border-box;background:#FDF6EE;font-family:inherit;color:#1A0A00}
.finp:focus{border-color:#7C1D1D;background:#fff}
.fsave{width:100%;padding:17px;background:#7C1D1D;color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:18px}
.fsave:active{background:#521212}
.success-msg{background:#D1FAE5;border:1px solid #6EE7B7;border-radius:12px;padding:14px;font-size:14px;color:#065F46;font-weight:600;margin-top:12px;display:none;text-align:center}
.edit-card{background:#FFF8F0;border:1.5px solid #C9943A;border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px}
.edit-card:active{background:#FDE68A}
</style>
</head>

}

function renderMembers(){
  var q=ST.q.toLowerCase().trim(),all=allP();
  var filt=q?all.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0||p.birth.toLowerCase().indexOf(q)>=0||p.bp.toLowerCase().indexOf(q)>=0;}):all;
  var groups={};filt.forEach(function(p){var pts=p.name.split(" ");var sn=pts.length>1?pts[pts.length-1]:p.name;if(!groups[sn])groups[sn]=[];groups[sn].push(p);});
  var sorted=Object.entries(groups).sort(function(a,b){return a[0].localeCompare(b[0]);});
  var h="<div class=\"swrap\"><div style=\"position:relative\"><span style=\"position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none\">\uD83D\uDD0D</span>";
  h+="<input class=\"sinput\" id=\"sq\" value=\""+esc(ST.q)+"\" placeholder=\"Search name, year, place\u2026\" oninput=\"onSrch(this.value)\" autocomplete=\"off\" autocorrect=\"off\" spellcheck=\"false\"/>";
  if(ST.q)h+="<button style=\"position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:20px;color:#A08060\" onclick=\"clrSrch()\">\u2715</button>";
  h+="</div><div style=\"font-size:12px;color:#A08060;margin-top:6px;text-align:center\">"+filt.length+" of "+all.length+" members</div></div>";
  sorted.forEach(function(e){
    h+="<div class=\"glbl\">"+esc(ST.hindi?toH(e[0]):e[0])+" <span style=\"color:#A08060;font-weight:400\">("+e[1].length+")</span></div>";
    e[1].forEach(function(p){h+=rowH(p,p.id===RAVI?" rr":"");});
  });
  return h;
}

function renderBirthdays(){
  var all=allP();
  var list=all.map(function(p){return{p:p,bd:parseBd(p.birth)};}).filter(function(x){return x.bd&&x.bd.m>0;});
  list.sort(function(a,b){return a.bd.m!==b.bd.m?a.bd.m-b.bd.m:a.bd.d-b.bd.d;});
  var byM={};list.forEach(function(x){var m=MN[x.bd.m];if(!byM[m])byM[m]=[];byM[m].push(x);});
  var h="<div style=\"padding:14px 16px;border-bottom:1px solid #EDE0D4;display:flex;justify-content:space-between;align-items:center\"><div><div style=\"font-size:18px;font-weight:700;color:#1A0A00;font-family:Georgia,serif\">Birthdays</div><div style=\"font-size:13px;color:#6B4226\">"+list.length+" known birthdays</div></div><button onclick=\"exportCSV()\" style=\"background:#7C1D1D;color:#fff;border:none;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer\">\u2B07\uFE0F Export</button></div>";
  Object.entries(byM).forEach(function(e){
    var month=e[0];h+="<div class=\"mnlbl\">"+month+" ("+e[1].length+")</div>";
    e[1].forEach(function(x){
      var p=x.p,bd=x.bd,r=relR(p.id);
      h+="<div class=\"brow\" onclick=\"openP('"+p.id+"')\"><div class=\"bcal\"><div class=\"bd\">"+bd.d+"</div><div class=\"bm\">"+month.slice(0,3).toUpperCase()+"</div></div>";
      h+="<div style=\"flex:1;min-width:0\"><div class=\"cgn\">"+esc(ST.hindi?toH(p.name):p.name)+"</div><div class=\"cgs\">"+(bd.y?"Born "+bd.y:"")+(r?" \xb7 "+esc(r):"")+"</div></div>";
      if(p.death)h+="<span style=\"color:#6B7280\">\u2726</span>";h+="</div>";
    });
  });
  return h;
}

function renderAddEdit(){
  var h="<div class=\"form-page\">";
  // ADD MEMBER FORM
  h+="<div class=\"form-card\">";
  h+="<div class=\"form-title\">\u2795 Add Family Member</div>";
  h+="<div class=\"form-sub\">Fill in the details and tap Save</div>";

function renderSheet(p){
  var r=relR(p.id),nm=esc(dn(p)),bg=bgc(p);
  var sp=spouses(p),pa=parents(p),ch=children(p),si=siblings(p);
  function cg(title,items,col){
    if(!items.length)return"";
    var h="<div style=\"margin-bottom:14px\"><div class=\"cglbl\" style=\"color:"+col+"\">"+title+" ("+items.length+")</div>";
    items.forEach(function(x){var xr=x._r||relR(x.id)||"";h+="<div class=\"cgrow\" onclick=\"openP('"+x.id+"')\">"+avH(x,42)+"<div style=\"flex:1;min-width:0\"><div class=\"cgn\">"+esc(ST.hindi?toH(x.name):x.name)+"</div><div class=\"cgs\">"+esc(xr)+(x.birth?" \xb7 "+esc(x.birth):"")+"</div></div><span style=\"color:#A08060;font-size:18px\">\u203a</span></div>";});
    return h+"</div>";
  }
  var ed=ST.edits&&ST.edits[p.id]?ST.edits[p.id]:{};
  var birth=ed.birth!==undefined?ed.birth:p.birth;
  var bp2=ed.bp!==undefined?ed.bp:p.bp;
  var notes=ed.notes||"";
  var h="<div class=\"shdr\" style=\"background:linear-gradient(160deg,"+bg+"18,"+bg+"05)\">";
  h+="<div class=\"pwrap\">"+avH(p,84)+"</div>";
  h+="<div><div class=\"sname\">"+nm+"</div>";
  if(ST.hindi&&nm!==esc(p.name))h+="<div style=\"font-size:13px;color:#6B4226;text-align:center\">"+esc(p.name)+"</div>";
  if(r)h+="<div class=\"srel\" style=\"background:"+bg+"20;color:"+bg+"\">"+esc(r)+"</div>";
  h+="</div><div class=\"pills\">";
  if(birth)h+="<span class=\"pill\">\uD83C\uDF82 "+esc(birth)+"</span>";
  if(bp2)h+="<span class=\"pill\">\uD83D\uDCCD "+esc(bp2)+"</span>";
  if(p.death)h+="<span class=\"pill dead\">\u2726 "+(p.death==="deceased"?"Deceased":esc(p.death))+"</span>";
  h+="</div></div>";
  if(notes)h+="<div style=\"margin:8px 16px;padding:12px;background:#FFF8F0;border-radius:12px;border-left:3px solid #C9943A;font-size:14px;color:#3B1F0E\">\uD83D\uDCDD "+esc(notes)+"</div>";
  // BIG PHOTO BUTTON
  h+="<div style=\"padding:8px 16px 4px\">";
  h+="<button onclick=\"trigPhoto('"+p.id+"')\" style=\"width:100%;padding:16px;background:"+(ST.photos[p.id]?"#E8F5E9":"#FFF8F0")+";border:2px dashed "+(ST.photos[p.id]?"#4CAF50":"#C9943A")+";border-radius:14px;font-size:16px;font-weight:700;color:"+(ST.photos[p.id]?"#1B5E20":"#7C1D1D")+";cursor:pointer;margin-bottom:8px\">";
  h+=ST.photos[p.id]?"\uD83D\uDCF7 Change Photo":"\uD83D\uDCF7 Add Photo";
  h+="</button>";
  // EDIT BUTTON
  h+="<button onclick=\"openEditSheet('"+p.id+"')\" style=\"width:100%;padding:16px;background:#FFF3E0;border:2px solid #C9943A;border-radius:14px;font-size:16px;font-weight:700;color:#7C1D1D;cursor:pointer;margin-bottom:8px\">\u270F\uFE0F Edit Birth Date, City &amp; Notes</button>";
  h+="</div>";
  // Edit form (hidden by default, shown inline)
  h+="<div id=\"edit-form-"+p.id+"\" style=\"display:none;padding:0 16px 8px\">";
  h+="<div style=\"background:#fff;border-radius:14px;padding:16px;border:1px solid #EDE0D4\">";
  h+="<div style=\"font-size:14px;font-weight:700;color:#7C1D1D;margin-bottom:12px\">Editing: "+nm+"</div>";
  h+="<label style=\"font-size:12px;font-weight:700;color:#7C1D1D;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px\">Date of Birth</label>";
  h+="<input id=\"ef-b-"+p.id+"\" value=\""+esc(birth)+"\" placeholder=\"e.g. 2 Oct 1963\" style=\"width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #EDE0D4;font-size:15px;outline:none;box-sizing:border-box;background:#FDF6EE;margin-bottom:10px\"/>";
  h+="<label style=\"font-size:12px;font-weight:700;color:#7C1D1D;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px\">City / Place</label>";
  h+="<input id=\"ef-p-"+p.id+"\" value=\""+esc(bp2)+"\" placeholder=\"e.g. Kolkata\" style=\"width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #EDE0D4;font-size:15px;outline:none;box-sizing:border-box;background:#FDF6EE;margin-bottom:10px\"/>";
  h+="<label style=\"font-size:12px;font-weight:700;color:#7C1D1D;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px\">Notes / Memories</label>";
  h+="<textarea id=\"ef-n-"+p.id+"\" placeholder=\"Profession, memory, story...\" rows=\"2\" style=\"width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #EDE0D4;font-size:15px;outline:none;box-sizing:border-box;background:#FDF6EE;resize:none;font-family:inherit\">"+esc(notes)+"</textarea>";
  h+="<div style=\"display:flex;gap:8px;margin-top:12px\">";
  h+="<button onclick=\"cancelEdit('"+p.id+"')\" style=\"flex:1;padding:14px;background:#EDE0D4;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;color:#5C3A1E\">Cancel</button>";
  h+="<button onclick=\"saveEditSheet('"+p.id+"')\" style=\"flex:1;padding:14px;background:#7C1D1D;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer\">Save</button>";
  h+="</div></div></div>";
  h+="<div style=\"padding-top:4px\">";
  h+=cg("Parents",pa,"#A0522D")+cg("Spouse",sp,"#521212")+cg("Children",ch,"#1E3A6E")+cg("Siblings",si,"#14532D");
  h+="</div>";
  h+="<div style=\"padding:4px 16px\"><button class=\"donebtn\" onclick=\"closeSheet()\">Done</button></div>";
  return h;
}

// EDIT FUNCTIONS
ST.edits={};
try{var _ed=localStorage.getItem("cft_edits");if(_ed)ST.edits=JSON.parse(_ed);}catch(_x){}
function saveEdits(){try{localStorage.setItem("cft_edits",JSON.stringify(ST.edits));}catch(e){}}
function openEditSheet(id){var el=document.getElementById("edit-form-"+id);if(el)el.style.display="block";}
function cancelEdit(id){var el=document.getElementById("edit-form-"+id);if(el)el.style.display="none";}
function saveEditSheet(id){
  if(!ST.edits[id])ST.edits[id]={};
  var b=document.getElementById("ef-b-"+id),p2=document.getElementById("ef-p-"+id),n=document.getElementById("ef-n-"+id);
  if(b)ST.edits[id].birth=b.value.trim();
  if(p2)ST.edits[id].bp=p2.value.trim();
  if(n)ST.edits[id].notes=n.value.trim();
  saveEdits();
  var p=gI(id);if(p&&ST.sel&&ST.sel.id===id)document.getElementById("sc").innerHTML=renderSheet(p);
}

function trigPhoto(id){ST.ptarget=id;document.getElementById("pi").click();}
function handlePhoto(e){
  var file=e.target.files[0];if(!file||!ST.ptarget)return;
  var cv=document.createElement("canvas"),img=new Image();
  img.onload=function(){var mx=300,sc=Math.min(mx/img.width,mx/img.height,1);cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);var url=cv.toDataURL("image/jpeg",0.8);ST.photos[ST.ptarget]=url;saveAll();if(ST.sel&&ST.sel.id===ST.ptarget)document.getElementById("sc").innerHTML=renderSheet(ST.sel);render();ST.ptarget=null;};
  img.src=URL.createObjectURL(file);e.target.value="";
}

// ADD MEMBER
function doAddMember(){
  var f=document.getElementById("am-f").value.trim();
  var l=document.getElementById("am-l").value.trim();
  if(!f){alert("Please enter a first name");return;}
  var name=l?f+" "+l:f;
  var id="@INEW"+Date.now()+"@";
  var np={id:id,name:name,sex:document.getElementById("am-s").value,birth:document.getElementById("am-b").value.trim(),bp:document.getElementById("am-p").value.trim(),death:"",famc:[],fams:[],_new:true};
  var notes=document.getElementById("am-n").value.trim();
  if(notes){if(!ST.edits[id])ST.edits[id]={};ST.edits[id].notes=notes;saveEdits();}
  I[id]=np;saveAll();
  ["am-f","am-l","am-b","am-p","am-n"].forEach(function(x){var el=document.getElementById(x);if(el)el.value="";});
  document.getElementById("am-s").value="M";
  var ok=document.getElementById("add-ok");if(ok)ok.style.display="block";
  setTimeout(function(){if(ok)ok.style.display="none";},4000);
}

function render(){
  var pg=document.getElementById("page");
  if(ST.tab==="home")pg.innerHTML=renderHome();
  else if(ST.tab==="members")pg.innerHTML=renderMembers();
  else if(ST.tab==="birthdays")pg.innerHTML=renderBirthdays();
  else pg.innerHTML=renderAddEdit();
  pg.scrollTop=0;
  ["home","members","birthdays","addedit"].forEach(function(t){var el=document.getElementById("t-"+t);if(el)el.className="ntab"+(ST.tab===t?" active":"");});
}
function goTab(t){ST.tab=t;ST.q="";render();}
function openP(id){var p=gI(id);if(!p)return;ST.sel=p;document.getElementById("sc").innerHTML=renderSheet(p);document.getElementById("overlay").className="show";document.getElementById("sheet").className="show";}
function closeSheet(){document.getElementById("overlay").className="";document.getElementById("sheet").className="";ST.sel=null;}
function onSrch(v){ST.q=v;render();}
function clrSrch(){ST.q="";render();}
function toggleHindi(){ST.hindi=!ST.hindi;document.getElementById("hbtn").textContent=ST.hindi?"A":"\u0905";render();if(ST.sel)document.getElementById("sc").innerHTML=renderSheet(ST.sel);}
function shareWA(){var msg=encodeURIComponent("\uD83C\uDF33 *Choudhary Family Tree*\n\nRavi Choudhary has shared our family heritage.\n\u2726 283+ members \xb7 140 years \xb7 Est. 1885 \xb7 Kolkata\n\nOpen the link to explore the family tree!");window.open("https://wa.me/?text="+msg,"_blank");}
function exportCSV(){
  var all=allP();var list=all.map(function(p){return{p:p,bd:parseBd(p.birth)};}).filter(function(x){return x.bd&&x.bd.m>0;});
  list.sort(function(a,b){return a.bd.m!==b.bd.m?a.bd.m-b.bd.m:a.bd.d-b.bd.d;});
  var rows=[["Name","Day","Month","Year","Relation"]];
  list.forEach(function(x){rows.push([x.p.name,x.bd.d,MN[x.bd.m],x.bd.y,relR(x.p.id)||"Extended"]);});
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'\\"')+'"';}).join(",");}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="Choudhary_Birthdays.csv";a.click();
}
render();
